<body class="min-h-screen flex flex-col text-slate-900">

  <!-- Шапка сайта -->
  <header class="w-full bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="resetSearch()">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-extrabold text-white text-sm shadow-md shadow-blue-500/20">
          ITB
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-bold leading-tight">IT & Business College</h1>
          <p class="text-[11px] text-slate-400">Справочник кураторов и старост</p>
        </div>
      </div>
      <button onclick="openModal()" class="inline-flex items-center gap-2 bg-emerald-500/10 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-500/30 text-xs sm:text-sm font-semibold px-3.5 py-1.5 rounded-xl transition duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        <span>Отправить онлайн-урок</span>
      </button>
    </div>
  </header>

  <!-- Главный блок: Spotlight-поиск и курсы -->
  <main class="flex-grow flex flex-col items-center justify-start max-w-5xl w-full mx-auto px-4 sm:px-6 pt-12 sm:pt-24 pb-16 transition-all duration-300" id="mainContainer">
    
    <!-- Приветственный блок (виден только при пустом поиске) -->
    <div id="heroText" class="text-center mb-8 space-y-2 max-w-xl transition-opacity duration-300">
      <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Поиск по колледжу</h2>
      <p class="text-xs sm:text-sm text-slate-500">Выберите курс или начните вводить группу, преподавателя, аудиторию</p>
    </div>

    <!-- Строка поиска -->
    <div class="w-full max-w-2xl relative mb-6">
      <div class="relative bg-white rounded-2xl spotlight-shadow transition-all duration-200 focus-within:ring-2 focus-within:ring-blue-600">
        <svg class="absolute left-4 sm:left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="spotlightSearch" 
          autofocus 
          placeholder="Поиск: группа, куратор, аудитория или телефон..." 
          class="w-full pl-12 sm:pl-14 pr-12 py-4 sm:py-4.5 text-base sm:text-lg bg-transparent rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none"
        >
        <button id="clearBtn" onclick="resetSearch()" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1" title="Очистить">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Только 1, 2, 3 курсы -->
      <div class="flex items-center justify-center gap-3 mt-4">
        <button id="btnCourse1" onclick="filterByCourse(1)" class="course-btn px-5 py-2 rounded-xl bg-white hover:bg-blue-50 border border-slate-200 hover:border-blue-300 shadow-sm transition font-bold text-xs sm:text-sm text-slate-700 hover:text-blue-600 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-cyan-500"></span>
          1 курс
        </button>
        <button id="btnCourse2" onclick="filterByCourse(2)" class="course-btn px-5 py-2 rounded-xl bg-white hover:bg-blue-50 border border-slate-200 hover:border-blue-300 shadow-sm transition font-bold text-xs sm:text-sm text-slate-700 hover:text-blue-600 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-blue-600"></span>
          2 курс
        </button>
        <button id="btnCourse3" onclick="filterByCourse(3)" class="course-btn px-5 py-2 rounded-xl bg-white hover:bg-blue-50 border border-slate-200 hover:border-blue-300 shadow-sm transition font-bold text-xs sm:text-sm text-slate-700 hover:text-blue-600 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          3 курс
        </button>
      </div>
    </div>

    <!-- Область результатов (показывается при поиске или выборе курса) -->
    <div id="resultsWrapper" class="w-full hidden space-y-4">
      <div class="flex items-center justify-between px-2 text-xs sm:text-sm text-slate-500 font-medium">
        <div>Найдено групп: <strong id="resultsCount" class="text-blue-600 font-bold">0</strong></div>
        <button onclick="resetSearch()" class="text-slate-400 hover:text-slate-700 underline text-xs">Скрыть результаты</button>
      </div>

      <!-- Сетка карточек -->
      <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"></div>
    </div>

  </main>

  <!-- Модальное окно: Отправка урока старосте в WhatsApp -->
  <div id="lessonModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 text-white w-full max-w-lg rounded-3xl p-6 sm:p-7 shadow-2xl space-y-5 relative">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <div>
        <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-400/20 px-2.5 py-0.5 rounded-full">WhatsApp Отправка</span>
        <h3 class="text-xl font-bold mt-2">Отправить ссылку на онлайн-урок</h3>
        <p class="text-xs text-slate-400 mt-1">Текст сформируется автоматически и откроется в чате WhatsApp старосты.</p>
      </div>

      <div class="space-y-3.5 text-xs sm:text-sm">
        <div>
          <label class="block font-semibold text-slate-300 mb-1">Группа:</label>
          <select id="modalGroupSelect" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"></select>
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">Ссылка Zoom или Google Meet:</label>
          <input type="url" id="modalLink" placeholder="https://meet.google.com/... или Zoom" class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">Предмет / Время (необязательно):</label>
          <input type="text" id="modalSubject" placeholder="Напр: Информатика (09:00)" class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <div class="flex gap-2.5 pt-2">
        <button onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl transition text-xs sm:text-sm">Отмена</button>

          <span>Открыть в WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

      { course: 3, group: "SCA24C", name: "Khadizha Khazhhazh", room: "Ауд. 506 (Блок C)", email: "khadizha.khazhhazh@alatoo.edu.kg", scheduleUrl: "https://aiuspo.edupage.org/timetable/view.php?num=47&class=-85", phone: "996999905900", phoneDisplay: "+996 (999) 905-900" },
      { course: 3, group: "DES24A", name: "Mirlan Nurbekov", room: "Ауд. H205 (Блок H)", email: "mirlan.nurbekov@alatoo.edu.kg", scheduleUrl: "https://aiuspo.edupage.org/timetable/view.php?num=47&class=-79", phone: "996507777840", phoneDisplay: "+996 (507) 777-840" },
      { course: 3, group: "DES24B", name: "Aizhamal Imankulova", room: "Ауд. 502 (Блок C)", email: "aizhamal.imankulova@alatoo.edu.kg", scheduleUrl: "https://aiuspo.edupage.org/timetable/view.php?num=47&class=-80", phone: "996504310508", phoneDisplay: "+996 (504) 310-508" }
    ];

    let selectedCourse = null;
    const input = document.getElementById('spotlightSearch');
    const clearBtn = document.getElementById('clearBtn');
    const heroText = document.getElementById('heroText');
    const resultsWrapper = document.getElementById('resultsWrapper');
    const resultsGrid = document.getElementById('resultsGrid');
    const resultsCount = document.getElementById('resultsCount');
    const modalSelect = document.getElementById('modalGroupSelect');

    // Заполнение селекта групп для отправки ссылки
    curatorsData.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.group;
      opt.textContent = `${c.group} (${c.course} курс) — ${c.name}`;
      modalSelect.appendChild(opt);
    });

    function getInitials(name) {
      const parts = name.trim().split(/\s+/);
      return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : name.slice(0, 2).toUpperCase();
    }

    function filterByCourse(courseNum) {
      if (selectedCourse === courseNum) {
        resetSearch();
        return;
      }
      selectedCourse = courseNum;
      input.value = '';
      updateCourseButtons();
      renderFiltered();
    }

    function updateCourseButtons() {
      [1, 2, 3].forEach(c => {
        const btn = document.getElementById(`btnCourse${c}`);
        if (selectedCourse === c) {
          btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md');
          btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-200');
        } else {
          btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md');
          btn.classList.add('bg-white', 'text-slate-700', 'border-slate-200');
        }
      });
    }

    function resetSearch() {
      input.value = '';
      selectedCourse = null;
      clearBtn.classList.add('hidden');
      resultsWrapper.classList.add('hidden');
      heroText.classList.remove('hidden');
      updateCourseButtons();
      input.focus();
    }

    input.addEventListener('input', () => {
      selectedCourse = null;
      updateCourseButtons();
      renderFiltered();
    });

    function renderFiltered() {
      const q = input.value.trim().toLowerCase();
      const cleanQ = q.replace(/[\s\-\(\)\+]/g, '');

      if (!q && selectedCourse === null) {
        resetSearch();
        return;
      }

      clearBtn.classList.remove('hidden');
      resultsWrapper.classList.remove('hidden');
      heroText.classList.add('hidden');

      const filtered = curatorsData.filter(item => {
        if (selectedCourse !== null) {
          return item.course === selectedCourse;
        }

        const groupClean = item.group.toLowerCase().replace(/[\s\-]/g, '');
        const phoneRaw = item.phone || '';
        const phoneDisplay = (item.phoneDisplay || '').toLowerCase();

        return (
          item.group.toLowerCase().includes(q) ||
          groupClean.includes(cleanQ) ||
          item.name.toLowerCase().includes(q) ||
          item.room.toLowerCase().includes(q) ||
          item.email.toLowerCase().includes(q) ||
          phoneRaw.includes(cleanQ) ||
          phoneDisplay.includes(q) ||
          (q.includes('курс') && item.course === parseInt(q))
        );
      });

      resultsCount.textContent = filtered.length;
      resultsGrid.innerHTML = '';

      if (filtered.length === 0) {
        resultsGrid.innerHTML = `
          <div class="col-span-full bg-white rounded-3xl p-10 text-center border border-dashed border-slate-300">
            <p class="text-sm font-bold text-slate-800">Ничего не найдено</p>
            <p class="text-xs text-slate-500 mt-1">По вашему запросу совпадений нет.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between";

        const initials = getInitials(item.name);
        const waLink = item.phone ? `https://api.whatsapp.com/send?phone=${item.phone}` : '#';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-600 text-white font-bold flex items-center justify-center text-xs">
                  ${initials}
                </div>
                <div>
                  <h4 class="text-sm font-bold text-slate-900 leading-tight">${item.name}</h4>
                  <span class="text-[11px] font-semibold text-slate-500">${item.course} курс</span>
                </div>
              </div>
              <span class="font-extrabold text-xs px-2.5 py-1 bg-slate-100 rounded-lg text-slate-900">${item.group}</span>
            </div>

            <div class="py-3 space-y-2 text-xs">
              <div class="flex justify-between items-center text-slate-600">
                <span>Аудитория:</span>
                <span class="font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded">${item.room}</span>
              </div>
              <div class="flex justify-between items-center text-slate-600">
                <span>Староста (WhatsApp):</span>
                <a href="${waLink}" target="_blank" class="font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2 py-0.5 rounded transition">
                  ${item.phoneDisplay}
                </a>
              </div>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-100 flex gap-2">
            <a href="${item.scheduleUrl}" target="_blank" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs py-2 rounded-xl text-center transition">
              Расписание
            </a>
            <a href="${waLink}" target="_blank" class="flex-1 bg-wa hover:bg-wa-hover text-white font-bold text-xs py-2 rounded-xl text-center transition flex items-center justify-center gap-1.5 shadow-sm">
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
              <span>WhatsApp</span>
            </a>
          </div>
        `;

        resultsGrid.appendChild(card);
      });
    }

    // Модальное окно
    function openModal() {
      document.getElementById('lessonModal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('lessonModal').classList.add('hidden');
    }

    function executeSendLesson() {
      const groupCode = document.getElementById('modalGroupSelect').value;
      const link = document.getElementById('modalLink').value.trim();
      const subject = document.getElementById('modalSubject').value.trim();

      if (!link) {
        showToast("Вставьте ссылку на урок!");
        return;
      }

      const item = curatorsData.find(c => c.group === groupCode);
      if (!item || !item.phone) {
        showToast("Номер старосты не найден!");
        return;
      }

      let msg = `Здравствуйте! Ссылка на онлайн-урок для группы ${item.group}:\n\n🔗 ${link}`;
      if (subject) msg += `\n📚 Предмет/Время: ${subject}`;
      msg += `\n\nСтароста, перешлите, пожалуйста, в общий чат студентов. Спасибо!`;

      const waUrl = `https://api.whatsapp.com/send?phone=${item.phone}&text=${encodeURIComponent(msg)}`;
      window.open(waUrl, '_blank');
      closeModal();
    }

    let toastTimeout;
    function showToast(text) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = text;
      toast.classList.remove('opacity-0', 'translate-y-6');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-6');
      }, 2300);
    }
  </script>
</body>
